# ReactOS 0.4.15 (released 2025-03-21), x86 32-bit, from the official
# bootcd ISO published on the upstream GitHub release.
#
# ReactOS is GPL-licensed and its install media is freely redistributable,
# which is what makes an anyvm builder possible here at all: the built
# image is published as a release asset, so a guest OS whose binaries
# cannot be redistributed (Windows itself) can never be built this way.
#
# STATUS: tech preview. Remote command execution over telnet works, and
# file sync works via tar streamed over that same telnet channel (see
# VM_SYNC_METHODS below -- busybox-w32 is baked in as the guest tar).
#
# ---------------------------------------------------------------------------
# Why this builder looks unlike every other ISO-install builder
# ---------------------------------------------------------------------------
# ReactOS ships NO remote-access server of any kind. base/applications/
# network contains arp dwnl finger ftp ipconfig net netsh netstat nslookup
# ping route telnet tracert whois wlanconf -- `telnet` there is the CLIENT.
# The rapps application database offers only PuTTY and WinSCP, also
# clients. So unlike plan9-builder (whose 9front guest already ships
# ip/telnetd and only had to be told to listen), this builder has to
# SUPPLY the server: files/anyvmtd.c is a small Win32 telnet server, cross
# compiled with mingw-w64 by hooks/host_beforeBuild.sh and baked onto the
# install media.
#
# The install itself is fully unattended through ReactOS's own native
# answer file (files/unattend.inf); nothing is driven over a console, so
# this builder needs neither OCR nor a serial login prompt (ReactOS puts
# only kernel debug output on COM1, never a shell).

VM_OS_NAME="reactos"
VM_RELEASE=0.4.15
VM_ARCH=i386

# NOTE: build.py never actually downloads this. hooks/host_beforeBuild.sh
# fetches this zip, unpacks the bootcd, remasters it with unattend.inf +
# anyvmtd.exe, and writes the result to $VM_WORKDIR/reactos.iso -- and
# createVM() skips its own download when that file already exists. The
# link stays here as the declared, single upstream source (it is also what
# hooks/upstream_check.py compares against, and what the URL gate in
# base-builder/watch.py would HEAD on a release bump).
VM_ISO_LINK="https://github.com/reactos/reactos/releases/download/0.4.15-release/ReactOS-0.4.15-release-1-gdbb43bbaeb2-x86-iso.zip"

VM_SSH_PORT=2222

# ---------------------------------------------------------------------------
# Transport: telnet (same engine path as plan9)
# ---------------------------------------------------------------------------
#   VM_TRANSPORT=telnet -> build.py points the control hostfwd at guest
#     port 23, replaces _wait_ssh with _wait_telnet, sends the shutdown
#     over telnet, and skips every ssh-only stage.
#   The server behind that port is our own anyvmtd.exe, which hands each
#     connection to cmd.exe. It authenticates nobody and is reachable only
#     through the slirp hostfwd bound to 127.0.0.1 -- the same threat model
#     as plan9-builder's no-auth telnetd.
VM_TRANSPORT=telnet

# _telnet_ready_check's default probe is Plan 9 rc syntax (`echo
# anyvm''-ready`), where the quote split keeps the shell's echo of the
# typed line from matching the marker. cmd.exe does not treat '' as a
# quote split at all, so the default probe could never match. The cmd.exe
# equivalent is the caret escape: `echo anyvm^-ready` prints anyvm-ready
# while the echoed command line still shows the caret.
VM_TELNET_PROBE_CMD="echo anyvm^-ready"
VM_TELNET_PROBE_MARKER="anyvm-ready"

# ---------------------------------------------------------------------------
# Install phase
# ---------------------------------------------------------------------------
# ReactOS usetup in unattended mode ends first stage by rebooting
# unconditionally -- there is no "press ENTER to restart" to stop on and
# no code that ejects the CD. With the engine's "-boot order=dc" that
# reboot lands back on the install CD and unattended setup reformats and
# reinstalls forever. VM_QEMU_NO_REBOOT adds "-no-reboot" to the install
# (cdrom) launch only, so that reboot exits QEMU instead -- which is
# exactly the signal main() waits for right after the installOpts hook.
# The later startVM boots the disk with no media attached and is free to
# reboot normally.
VM_QEMU_NO_REBOOT=1

# ---------------------------------------------------------------------------
# Guest hardware -- ReactOS has no virtio storage or virtio-gpu driver
# ---------------------------------------------------------------------------
# Disk: IDE. drivers/storage has no virtio-blk miniport, so the engine's
#   virtio default would leave setup with no disk to install to.
# NIC: e1000. drivers/network/dd ships dc21x4, e1000, ne2000, netkvm,
#   nvnet, pcnet, rtl8139. netkvm (virtio-net) exists but e1000 is the
#   better-worn path under QEMU.
# VGA: std. The engine default (virtio-vga) has no ReactOS driver; the
#   VGA/VBE miniport does. Nothing reads the screen during this build, but
#   the VNC console is what a human debugs a red run with.
VM_DISK="ide"
VM_NIC=e1000
VM_VGA=std

# FAT32 is what usetup formats by default, and Windows-family FAT32
# formatting refuses volumes over 32 GB, so the engine's 200 G default
# disk cannot be used. 16 G leaves plenty of headroom over a ~700 MB
# install. anyvm.py never resizes, so this size carries into the runtime
# VM.
VM_DISK_SIZE=16G

VM_MEMORY=2048

# shutdown.exe ships in the default install (base/applications/shutdown).
# Its parser accepts both '-' and '/' prefixes; '/p' means "turn off the
# local computer with no warning and no timeout" (verified in
# base/applications/shutdown/shutdown.c). If ACPI poweroff does not take,
# shutdown_and_wait falls back to the monitor powerdown and then to
# _wait_vm_down's force-kill, bounded by VM_SHUTDOWN_MAX_SECONDS.
VM_SHUTDOWN_CMD="shutdown /p"
VM_SHUTDOWN_MAX_SECONDS=600

# Intentionally unset:
#   VM_LOGIN_TAG / VM_LOGIN_MAX_SECONDS -- hooks/host_waitForLoginTag.py
#     replaces the console login-tag wait entirely (a waitForLoginTag hook
#     short-circuits start_and_wait), so it carries its own bound.
#   VM_OPTS / VM_INSTALL_CMD / VM_PRE_INSTALL_PKGS / VM_INSTALL_SCRIPT /
#     VM_EXTRA_SCRIPT -- the install is answer-file driven, and ReactOS has
#     no package manager usable unattended (rapps needs the network and a
#     GUI).
#   No hooks/host_postBuild.* either: main() unconditionally calls
#     _wait_ssh() after a postBuild hook, which a telnet-transport guest
#     can never satisfy.

# File sync: tar over the anyvmtd telnet channel. The host streams a ustar
# archive down the connection and busybox-w32's tar applet -- baked at
# C:\anyvm\tar.exe by hooks/host_beforeBuild.sh + files/inject.sh, verified
# to run on ReactOS (uname: Windows_NT reactos 5.2 3790 i686) -- unpacks
# it; the pull direction is the same stream in reverse (anyvmtd escapes
# outbound IAC so the binary stream survives, see files/anyvmtd.c
# send_iac_escaped). Every other candidate was surveyed IN A RUNNING GUEST
# and is broken or absent -- the findings, so nobody has to redo them:
#
#   ssh family (rsync/sshfs/scp)  no sshd and no ssh client at all.
#   9P                            no client.
#   SMB                           NO redirector: C:\ReactOS\system32\drivers
#                                 has mup.sys but no mrxsmb.sys, so `net use`
#                                 over SMB cannot work and QEMU's built-in
#                                 slirp `smb=` share is useless here.
#   certutil base64               ReactOS's certutil is a ~4 KB stub that
#                                 implements only -? and -hashfile (and that
#                                 takes no algorithm argument). No -encode /
#                                 -decode, so the zero-dependency "base64
#                                 over the existing telnet channel" trick
#                                 does not work either.
#   NFS                           PRESENT AND FULLY REGISTERED, BUT BROKEN.
#                                 The image ships the whole ms-nfs41-client
#                                 stack -- drivers/nfs41_driver.sys,
#                                 nfsd.exe, nfs41_np.dll, ms-nfs41-idmap.conf
#                                 -- and the registry is already correct:
#                                 ProviderOrder="nfs41_driver" and
#                                 Services\nfs41_driver\NetworkProvider
#                                 carries ProviderPath=System32\nfs41_np.dll.
#                                 `net start nfs41_driver` really does reach
#                                 STATE 4 RUNNING. What fails is the daemon:
#                                 the service is named `pnfs` (DisplayName
#                                 "NFSv4.1 Client", ImagePath
#                                 "%SystemRoot%\system32\nfsd.exe --noldap",
#                                 Start=3 demand-start), and `net start pnfs`
#                                 sits in START_PENDING forever. `net use Z:
#                                 \\192.168.122.1\<export>` then fails with
#                                 System error 2, against a host export the
#                                 guest can ping and that Linux kernel nfsd
#                                 is serving on 2049. Fixing that is ReactOS
#                                 work, not builder work.
#
# (The other candidates that would need new code -- driving the guest's
# ftp/ncftp CLIENT from a host-side FTP server, or a put/get protocol in
# anyvmtd -- are superseded by the tar stream above.)
VM_SYNC_METHODS="tar"
